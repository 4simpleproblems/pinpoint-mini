<!DOCTYPE html>
<html lang="en">
<head>
  
  <meta charset="utf-8">
  <title>Classes</title>
  <link rel="icon" type="image/png" href="../favicons/google-classroom.png"/>
  <link rel="shortcut icon" type="image/png" href="../favicons/google-classroom.png"/>
  <script defer src="https://cloud.umami.is/script.js" data-website-id="aa9f6a9e-fe62-4b22-a716-f161605dadfc"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }
    #player-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    ruffle-player {
      width: 100% !important;
      height: 100% !important;
    }
  </style>
  <script>
    let baseOrigin = (window.location.origin && window.location.origin !== "null" && !window.location.origin.startsWith("blob")) ? window.location.origin : "";
    try {
      if ((!baseOrigin || baseOrigin.startsWith("blob")) && window.parent && window.parent.location && window.parent.location.origin && window.parent.location.origin !== "null" && !window.parent.location.origin.startsWith("blob")) {
        baseOrigin = window.parent.location.origin;
      }
    } catch(e) {}
    if (!baseOrigin || baseOrigin.startsWith("blob")) {
      try {
        baseOrigin = localStorage.getItem('pinpoint_entry_origin') || "";
      } catch(e) {}
    }
    if (!baseOrigin || baseOrigin.startsWith("blob")) {
      baseOrigin = window.location.protocol.startsWith("http") ? (window.location.protocol + "//" + window.location.host) : "https://notebook.broshan.com.np";
    }
    if (baseOrigin.endsWith("/")) baseOrigin = baseOrigin.slice(0, -1);

    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      autoplay: "on",
      unmuteOverlay: "hidden",
      letterbox: "on",
      warnOnUnsupportedContent: false,
      publicPath: baseOrigin + "/textbooks/ruffle/"
    };
  </script>
  <script src="/textbooks/ruffle/ruffle.js"></script>
</head>
<body>
  <div id="player-container"></div>
  <script>
    window.addEventListener("DOMContentLoaded", async () => {
      try {
        const ruffle = window.RufflePlayer.newest();
        const player = ruffle.createPlayer();
        const container = document.getElementById("player-container");
        container.appendChild(player);

        const swfUrl = (baseOrigin || "") + "/textbooks/happy-wheels.swf";
        let buffer = null;
        try {
          const res = await fetch(swfUrl);
          if (res.ok) buffer = await res.arrayBuffer();
        } catch(e) {}
        if (!buffer) {
          try {
            const res = await fetch("happy-wheels.swf");
            if (res.ok) buffer = await res.arrayBuffer();
          } catch(e) {}
        }
        if (!buffer) {
          try {
            const res = await fetch("https://raw.githubusercontent.com/pinpoint-edu/assets/main/textbooks/happy-wheels.swf");
            if (res.ok) buffer = await res.arrayBuffer();
          } catch(e) {}
        }
        if (buffer) {
          player.load({ data: buffer });
          return;
        }
        player.load({ url: swfUrl });
      } catch (err) {
        console.error("Error loading Happy Wheels:", err);
      }
    });
  </script>
  <script src="../tab-disguiser.js"></script>
</body>
</html>
