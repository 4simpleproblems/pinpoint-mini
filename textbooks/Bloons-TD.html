    window.addEventListener("DOMContentLoaded", async () => {
      try {
        const ruffle = window.RufflePlayer.newest();
        const player = ruffle.createPlayer();
        const container = document.getElementById("player-container");
        container.appendChild(player);

        const swfUrl = (baseOrigin || "") + "/textbooks/Bloons-TD.swf";
        try {
          const res = await fetch(swfUrl);
          if (res.ok) {
            const buffer = await res.arrayBuffer();
            player.load({ data: buffer });
            return;
          }
        } catch(fetchErr) {
          console.warn("Direct buffer fetch failed, using embedded fallback:", fetchErr);
        }

        // Embedded base64 binary fallback for standalone/offline blob execution
        if (EMBEDDED_SWF_BASE64) {
          const binary = atob(EMBEDDED_SWF_BASE64);
          const bytes = new Uint8Array(binary.length);
          for (let i = 0; i < binary.length; i++) {
            bytes[i] = binary.charCodeAt(i);
          }
          player.load({ data: bytes.buffer });
          return;
        }

        player.load({ url: swfUrl });
      } catch (err) {
        console.error("Error loading Bloons TD:", err);
      }
    });
