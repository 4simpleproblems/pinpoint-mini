<!DOCTYPE html>
<html lang="en-us">
  <head>
    <base href="/textbooks/crazy-pixel-apocalypse-9/">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Crazy Pixel Apocalypse 9</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="fonts/fonts.css">
    <link rel="stylesheet" href="TemplateData/style.css">

    <script id="gamemonetize-sdk">
      // Local SDK stub to prevent external ad/analytics requests and auto-resume gameplay
      window.SDK_OPTIONS = window.SDK_OPTIONS || {};
      window.sdk = {
        showBanner: function() {
          if (window.SDK_OPTIONS && typeof window.SDK_OPTIONS.onEvent === 'function') {
            window.SDK_OPTIONS.onEvent({ name: 'SDK_GAME_START' });
          }
          return Promise.resolve();
        }
      };
      window.showNextAd = function() {
        if (window.SDK_OPTIONS && typeof window.SDK_OPTIONS.onEvent === 'function') {
          window.SDK_OPTIONS.onEvent({ name: 'SDK_GAME_START' });
        }
      };
    </script>

    <style>
      html, body {
        background: #2b2b2b !important;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-family: Arial, Helvetica, sans-serif;
      }

      #loading-cover {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #2b2b2b !important;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        user-select: none;
      }

      #progress-text {
        color: #ffffff;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 36px;
        font-weight: bold;
        letter-spacing: 1px;
      }

      .progress-track {
        width: 240px;
        height: 6px;
        background: #3e3e3e;
        border-radius: 3px;
        overflow: hidden;
        margin-top: 18px;
      }

      .progress-fill {
        width: 0%;
        height: 100%;
        background: #a0a0a0;
        border-radius: 3px;
        transition: width 0.15s ease-out;
      }

      #loading-cover.fade-out {
        animation: fadeOut 400ms ease forwards;
      }

      @keyframes fadeOut {
        to { opacity: 0; visibility: hidden; }
      }

      #unity-container {
        width: 100%;
        height: 100%;
        position: absolute;
      }
      
      canvas {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  
  <body class="light">
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas"></canvas>
    </div>

    <div id="loading-cover">
      <div id="progress-text">0%</div>
      <div class="progress-track">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
    </div>

    <script>
      const buildUrl = "Build";
      const loaderUrl = buildUrl + "/puxx.loader.js";
      const config = {
        dataUrl: buildUrl + "/puxx.data.unityweb",
        frameworkUrl: buildUrl + "/puxx.framework.js.unityweb",
        codeUrl: buildUrl + "/puxx.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Mentolatux",
        productName: "Crazy Pixel Apocalypse 9",
        productVersion: "11",
      };

      const container = document.querySelector("#unity-container");
      const canvas = document.querySelector("#unity-canvas");
      const loadingCover = document.querySelector("#loading-cover");

      // Start loading
      const script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          const fill = document.getElementById("progress-fill");
          const text = document.getElementById("progress-text");
          if(fill) fill.style.width = (100 * progress) + "%";
          if(text) text.innerHTML = Math.round(100 * progress) + "%";

        }).then((unityInstance) => {
          if(loadingCover) {
            loadingCover.classList.add("fade-out");
            setTimeout(() => {
              loadingCover.style.display = "none";
            }, 550);
          }
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);

      // Force mobile optimizations if needed
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        container.className = "unity-mobile";
        config.devicePixelRatio = 1.5;
      }
    </script>
  </body>
</html>
